<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sora Go · Contratar y pagar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Identidad Sora (plataforma): fondo gris claro, tarjetas blancas, azul marino para secciones de impacto.
     Color con significado: azul = acción principal, verde = completado, morado = pendiente, amarillo = advertencia. */
  :root{
    --bg:#F3F4F6; --card:#FFFFFF; --ink:#111827; --ink2:#374151; --muted:#6B7280; --line:#E5E7EB; --soft:#F9FAFB;
    --navy:#111827; --navy2:#1F2937; --navy-line:rgba(255,255,255,.10); --on-navy:#FFFFFF; --on-navy2:#9CA3AF;
    --accent:#2563EB; --accent-h:#1D4ED8; --accent-soft:#EFF6FF; --accent-line:#BFDBFE;
    --green:#10B981; --green-t:#047857; --green-soft:#ECFDF5;
    --amber:#F59E0B; --amber-t:#B45309; --amber-soft:#FFFBEB;
    --purple:#8B5CF6; --purple-t:#6D28D9; --purple-soft:#F5F3FF;
    --r:14px; --shadow:0 1px 2px rgba(17,24,39,.05),0 4px 14px rgba(17,24,39,.05);
    --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5;font-weight:400}
  button{font-family:inherit}
  a{color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .wrap{max-width:1120px;margin:0 auto;padding:16px 20px 48px}
  .top{display:flex;align-items:center;gap:10px;padding:4px 0 14px}
  .logo{font-weight:700;font-size:22px;letter-spacing:-.6px;color:var(--ink)}
  .logo span{color:var(--accent)}
  .top-l{font-size:12.5px;font-weight:500;color:var(--muted);padding-left:10px;border-left:1px solid var(--line)}

  /* tipografía */
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
  .eyebrow::before{content:'';width:18px;height:2px;border-radius:2px;background:currentColor}
  .dark .eyebrow{color:#93C5FD}
  h1{font-weight:700;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
  h2{font-weight:600;text-wrap:balance}
  .sub{color:var(--muted);font-size:15.5px;margin-top:8px;max-width:620px}

  /* transiciones entre pantallas */
  .screen{animation:in .28s cubic-bezier(.2,.7,.2,1)}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* bloques oscuros estratégicos */
  .dark{background:var(--navy);color:var(--on-navy);border-radius:20px;position:relative;overflow:hidden}
  .dark::after{content:'';position:absolute;inset:0;pointer-events:none;background:
    radial-gradient(600px 240px at 100% 0%,rgba(37,99,235,.35),transparent 70%),
    radial-gradient(400px 200px at 0% 100%,rgba(37,99,235,.12),transparent 70%)}
  .dark > *{position:relative;z-index:1}
  .dark .sub{color:var(--on-navy2)}

  /* progreso */
  .prog{display:flex;align-items:center;gap:12px;max-width:720px;margin:0 auto}
  .prog .bar-p{flex:1;height:4px;background:var(--line);border-radius:3px;overflow:hidden}
  .prog .bar-p i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .35s cubic-bezier(.2,.7,.2,1)}
  .prog span{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .prog.wide{max-width:980px}.prog.full{max-width:none}
  .back{border:none;background:none;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;padding:6px 0}
  .back:hover{color:var(--ink)}

  /* inicio: encabezado oscuro conectado con las tarjetas de necesidades */
  .start{max-width:820px;margin:0 auto}
  .start-h{padding:34px 36px 74px}
  .start-h h1{font-size:38px;margin-top:12px;max-width:640px}
  .start-h .sub{font-size:16.5px;margin-top:12px}
  .start-h .diag-chip{margin-top:18px}
  .diag-chip{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--on-navy2);border:1px solid var(--navy-line);padding:5px 12px;border-radius:100px}
  .diag-chip i{width:6px;height:6px;border-radius:50%;background:var(--green)}
  .start-b{background:var(--card);border-radius:18px;box-shadow:0 10px 40px rgba(17,24,39,.12);margin:-48px 16px 0;padding:22px;position:relative;z-index:2}
  .needs-sub{font-size:18px;font-weight:600}
  .needs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .need{display:flex;align-items:center;gap:14px;text-align:left;border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s,transform .15s;color:var(--ink)}
  .need:hover{border-color:var(--accent-line);transform:translateY(-1px)}
  .need.on{border-color:var(--accent);background:var(--accent-soft)}
  .need-ico{width:40px;height:40px;border-radius:11px;background:var(--bg);color:var(--ink2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,color .15s}
  .need.on .need-ico{background:var(--accent);color:#fff}
  .need-ico svg{width:21px;height:21px}
  .need-b{flex:1;min-width:0}
  .need-n{display:block;font-weight:600;font-size:15px}
  .need-d{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
  .need-chk{width:22px;height:22px;border-radius:50%;border:1.5px solid #D1D5DB;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;transition:background .15s,border-color .15s}
  .need.on .need-chk{background:var(--accent);border-color:var(--accent)}
  .need.need-explore{margin-top:10px;width:100%;border-style:dashed}
  .need.need-explore.on{border-style:solid}

  /* preguntas: limpio, gris claro, tarjetas blancas, seleccionado en azul */
  .q{max-width:720px;margin:22px auto 0}
  .q h1{font-size:28px;margin-top:10px}
  .ops{display:grid;gap:10px;margin-top:22px}
  .op{display:flex;align-items:center;gap:14px;text-align:left;border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:15px 18px;cursor:pointer;font-size:15px;font-weight:500;color:var(--ink);transition:border-color .15s,background .15s,transform .15s;box-shadow:var(--shadow)}
  .op:hover{border-color:var(--accent-line);transform:translateY(-1px)}
  .op.on{border-color:var(--accent);background:var(--accent-soft)}
  .op .rd{width:18px;height:18px;border-radius:50%;border:1.5px solid #D1D5DB;flex-shrink:0;transition:border .15s}
  .op.on .rd{border:6px solid var(--accent)}
  .op small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
  .subq{margin-top:22px;padding:18px;border-radius:14px;background:var(--accent-soft);animation:in .25s}
  .subq h2{font-size:16px;margin-bottom:12px}
  .subq .ops{margin-top:0;grid-template-columns:repeat(3,1fr)}
  .subq .op{padding:12px 14px;font-size:14px;justify-content:center;text-align:center}
  .subq .op .rd{display:none}
  .subq .ops.ico .op{flex-direction:column;gap:8px;padding:14px 10px}
  .op-ico{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
  .op-ico svg{width:20px;height:20px}
  .omit{display:block;margin:12px auto 0;border:none;background:none;color:var(--muted);font-size:12.5px;font-weight:500;cursor:pointer;text-decoration:underline}
  .txt-row{display:flex;gap:8px;flex-wrap:wrap}
  .txt-row input{flex:1;min-width:200px;font:inherit;font-size:15px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none}
  .txt-row input:focus{border-color:var(--accent)}
  .chip-b{border:1.5px solid var(--line);background:#fff;padding:10px 14px;border-radius:12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink2)}
  .chip-b.on{border-color:var(--accent);background:var(--accent);color:#fff}
  .subq .next{margin-top:12px}
  .next{margin-top:22px;display:flex;justify-content:flex-end}

  /* botones */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;background:var(--accent);color:#fff;font-weight:600;font-size:15px;padding:13px 22px;border-radius:12px;cursor:pointer;text-decoration:none;transition:background .15s,transform .15s}
  .btn:hover{background:var(--accent-h)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.big{width:100%;padding:15px;font-size:15.5px}
  .btn.light{background:#fff;color:var(--navy)}
  .btn.light:hover{background:#E5E7EB}

  /* empleados */
  .emp-in{display:flex;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap}
  .emp-in input{font:inherit;font-size:34px;font-weight:700;width:180px;text-align:center;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;color:var(--ink);outline:none;-moz-appearance:textfield;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
  .emp-in input::-webkit-outer-spin-button,.emp-in input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .emp-in input:focus{border-color:var(--accent)}
  .emp-in label{color:var(--muted);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.1em}
  .emp-hint{color:var(--amber-t);font-size:13px;margin-top:12px;min-height:18px}

  /* resultado */
  .res{max-width:980px;margin:12px auto 0}
  .res-h{padding:30px 32px 30px}
  .res-h h1{font-size:32px;margin-top:10px;max-width:640px}
  .res-h .sub{font-size:16px}
  .res-procs{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .res-procs span{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:#E5E7EB;background:rgba(255,255,255,.06);border:1px solid var(--navy-line);padding:6px 11px;border-radius:100px}
  .res-procs svg{width:14px;height:14px;color:#93C5FD}
  .vcards{display:grid;gap:16px;margin-top:18px}
  .vc{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:26px;align-items:center;transition:border-color .2s,box-shadow .2s}
  .vc.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
  .vc-main{min-width:0}
  .vc-top{display:flex;align-items:flex-start;gap:12px}
  .vc-ico{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .vc-ico svg{width:21px;height:21px}
  .vc-head{flex:1;min-width:0}
  .vc-name{font-weight:700;font-size:17px;line-height:1.25;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .vc-msg{font-size:14px;color:var(--ink2);margin-top:4px;line-height:1.45}
  .vc-badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
  .vc-badge.opt{background:var(--bg);color:var(--muted)}
  .vc-add{border:1.5px solid var(--accent);background:#fff;color:var(--accent);font-weight:600;font-size:13px;padding:8px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .15s,color .15s}
  .vc-add:hover{background:var(--accent-soft)}
  .vc-add.on{background:var(--accent);color:#fff}
  .cmp{display:grid;grid-template-columns:1fr;gap:8px;margin-top:16px}
  .cmp-col{border-radius:12px;padding:12px 14px}
  .cmp-col.hoy{background:var(--soft);border:1px dashed #D1D5DB}
  .cmp-col.sora{background:var(--accent-soft)}
  .cmp-h{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
  .cmp-col.hoy .cmp-h{color:var(--muted)}
  .cmp-col.sora .cmp-h{color:var(--accent)}
  .cmp-col.hoy p{font-size:13.5px;color:var(--ink2);line-height:1.45}
  .cmp-col.sora ul{list-style:none;display:grid;gap:5px}
  .cmp-col.sora li{font-size:13.5px;color:var(--ink);padding-left:20px;position:relative;line-height:1.4}
  .cmp-col.sora li::before{content:'';position:absolute;left:2px;top:5px;width:10px;height:6px;border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg)}
  .cmp-arrow{display:none}
  .benef{list-style:none;margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
  .benef li{font-size:12.5px;font-weight:500;color:var(--green-t);background:var(--green-soft);padding:4px 10px;border-radius:100px}
  .vc-pain{font-size:13.5px;color:var(--ink2);margin-top:14px;padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;line-height:1.5}
  .vc.cumpl{background:linear-gradient(180deg,#F8FAFF,#fff)}
  .otras-h{font-size:15px;font-weight:600;color:var(--ink);margin:30px 0 12px}
  .otras{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .vc-mini{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px 14px;box-shadow:var(--shadow)}
  .vc-mini-ico{width:34px;height:34px;border-radius:9px;background:var(--bg);color:var(--ink2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .vc-mini-ico svg{width:18px;height:18px}
  .vc-mini-b{flex:1;min-width:0}
  .vc-mini-n{font-weight:600;font-size:14px}
  .vc-mini-d{font-size:12.5px;color:var(--muted);margin-top:1px}
  .vc-mini-add{border:1.5px solid var(--line);background:#fff;color:var(--accent);font-weight:600;font-size:13px;padding:7px 12px;border-radius:10px;cursor:pointer;white-space:nowrap;flex-shrink:0}
  .vc-mini-add:hover{border-color:var(--accent)}
  .vc-mini-add.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .okbox{margin-top:18px;padding:18px 20px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);color:var(--ink2);font-size:14.5px}
  .okbox b{display:block;color:var(--ink);margin-bottom:4px}

  /* Tu Sora ideal: bloque oscuro con la configuración del usuario */
  .ideal{margin-top:28px;padding:26px 28px}
  .ideal-g{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:end}
  .ideal h2{font-size:24px;font-weight:700;margin-top:8px;letter-spacing:-.01em}
  .ideal-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .ideal-list span{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;color:#fff;background:rgba(255,255,255,.07);border:1px solid var(--navy-line);padding:8px 12px;border-radius:12px}
  .ideal-list span i{width:18px;height:18px;border-radius:50%;background:var(--green);display:inline-flex;align-items:center;justify-content:center}
  .ideal-list span i::after{content:'';width:7px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-1px) rotate(-45deg)}
  .ideal-list span.vacio{color:var(--on-navy2);border-style:dashed}
  .btn.light:disabled{background:#374151;color:#9CA3AF}
  .ideal-meta{font-size:13.5px;color:var(--on-navy2);margin-top:14px}
  .ideal-meta b{color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
  .ideal-cta{display:flex;flex-direction:column;align-items:stretch;gap:8px;min-width:250px}
  .ideal-cta .btn{padding:14px 20px}
  .ideal-cta small{font-size:12px;color:var(--on-navy2);text-align:center}

  /* mini-interfaces animadas (apariencia de la plataforma) */
  .ui{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(17,24,39,.10);overflow:hidden;font-size:12.5px;color:var(--ink)}
  .ui-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--soft)}
  .ui-logo{width:20px;height:20px;border-radius:6px;background:var(--navy);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
  .ui-t{font-weight:600}
  .ui-tag{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ui-b{padding:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
  .ui-card{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px}
  .ui-card b{display:block;font-weight:600;font-size:12.5px}
  .ui-card small{display:block;font-size:11px;color:var(--muted)}
  .ui-card .grow{flex:1;min-width:0}
  .ui-di{width:30px;height:36px;border-radius:5px;background:var(--accent-soft);border:1px solid var(--accent-line);position:relative;flex-shrink:0}
  .ui-di::before,.ui-di::after{content:'';position:absolute;left:6px;right:6px;height:2px;border-radius:2px;background:#93C5FD}
  .ui-di::before{top:10px}.ui-di::after{top:16px;right:10px}
  .ui-row{display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid #F3F4F6}
  .ui-row:last-child{border-bottom:none}
  .ui-row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ui-av{width:22px;height:22px;border-radius:50%;background:var(--bg);color:var(--muted);font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .ck{display:inline-grid;flex-shrink:0}.ck > *{grid-area:1/1}
  .ring{width:16px;height:16px;border-radius:50%;border:1.5px dashed #C4B5FD;background:var(--purple-soft)}
  .tick{width:16px;height:16px;border-radius:50%;background:var(--green);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .tick::after{content:'';width:6px;height:3px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-1px) rotate(-45deg)}
  .st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:100px;white-space:nowrap}
  .st::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
  .st.p{background:var(--purple-soft);color:var(--purple-t)}
  .st.a{background:var(--accent-soft);color:var(--accent)}
  .st.g{background:var(--green-soft);color:var(--green-t)}
  .st.w{background:var(--amber-soft);color:var(--amber-t)}
  .ui-prog{display:grid;gap:5px}
  .ui-prog .pl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
  .ui-prog .pl b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .ui-bar{height:6px;border-radius:4px;background:var(--bg);overflow:hidden}
  .ui-bar i{display:block;height:100%;border-radius:4px;background:var(--accent);width:var(--to)}
  .ui-bar.g i{background:var(--green)}
  .ui-bar i.fill{animation:fill 8s ease-in-out infinite}
  .ui-face{width:46px;height:46px;border-radius:12px;background:var(--navy);position:relative;overflow:hidden;flex-shrink:0}
  .ui-face::before{content:'';position:absolute;left:13px;top:9px;width:20px;height:20px;border-radius:50%;border:2px solid #93C5FD}
  .ui-face::after{content:'';position:absolute;left:8px;top:31px;width:30px;height:16px;border-radius:15px 15px 0 0;border:2px solid #93C5FD;border-bottom:none}
  .ui-face .scan{position:absolute;left:4px;right:4px;height:2px;background:#60A5FA;box-shadow:0 0 8px #60A5FA;top:8px;animation:scan 1.6s ease-in-out infinite alternate}
  .ui-big{font-size:18px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .ui-note{font-size:11px;color:var(--muted)}
  /* cambios de estado: varios estados apilados en la misma celda; uno visible a la vez */
  .sw{display:inline-grid;justify-items:end}
  .sw > *{grid-area:1/1}
  .sw3 > :nth-child(1){animation:swA 8s infinite}
  .sw3 > :nth-child(2){animation:swB 8s infinite;opacity:0}

  /* Vacaciones: solicitud → aprobación → documento de disfrute → firma (10 s) */
  .va3 > :nth-child(1){animation:a3a 10s infinite}.va3 > :nth-child(2){animation:a3b 10s infinite;opacity:0}.va3 > :nth-child(3){animation:a3c 10s infinite;opacity:0}
  @keyframes a3a{0%,18%{opacity:1}21%,97%{opacity:0}100%{opacity:1}}
  @keyframes a3b{0%,18%{opacity:0}21%,34%{opacity:1}37%,100%{opacity:0}}
  @keyframes a3c{0%,34%{opacity:0}37%,97%{opacity:1}100%{opacity:0}}
  .vb3 > :nth-child(1){animation:b3a 10s infinite}.vb3 > :nth-child(2){animation:b3b 10s infinite;opacity:0}.vb3 > :nth-child(3){animation:b3c 10s infinite;opacity:0}
  @keyframes b3a{0%,36%{opacity:1}39%,97%{opacity:0}100%{opacity:1}}
  @keyframes b3b{0%,36%{opacity:0}39%,62%{opacity:1}65%,100%{opacity:0}}
  @keyframes b3c{0%,62%{opacity:0}65%,97%{opacity:1}100%{opacity:0}}
  .vs2 > :nth-child(1){animation:s2a 10s infinite}.vs2 > :nth-child(2){animation:s2b 10s infinite;opacity:0}
  @keyframes s2a{0%,62%{opacity:1}65%,97%{opacity:0}100%{opacity:1}}

  .vaok{animation:vok 10s infinite;opacity:0}
  @keyframes vok{0%,64%{opacity:0;transform:scale(.6)}68%,97%{opacity:1;transform:none}100%{opacity:0}}
  /* tarjeta simplificada: frase + 3-4 beneficios; la animación lleva el protagonismo */
  .vc-list{list-style:none;display:grid;gap:9px;margin-top:16px}
  .vc-list li{font-size:14px;color:var(--ink2);padding-left:24px;position:relative;line-height:1.4}
  .vc-list li::before{content:'';position:absolute;left:0;top:2px;width:16px;height:16px;border-radius:50%;background:var(--accent-soft)}
  .vc-list li::after{content:'';position:absolute;left:5px;top:6px;width:6px;height:3px;border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg)}
  .vc-demo{background:linear-gradient(160deg,#EEF2FF 0%,#F3F4F6 70%);border-radius:16px;padding:22px}
  .vc-demo .ui{font-size:13px;box-shadow:0 18px 40px rgba(17,24,39,.14)}
  .vc-demo .ui-b{padding:14px;gap:10px}
  .vc-demo .ui-card b{font-size:13.5px}
  .vc-demo .fs{font-size:11px;padding:4px 9px}
  /* Reloj: consentimiento → marcajes → aclaraciones → firma de jornada (10 s) */

  /* complementarias */

  .comp-actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:14px}
  .comp-demo{max-width:420px;margin-top:14px;animation:in .2s}
  .vc-link{border:none;background:none;padding:0;font-size:13px;font-weight:600;color:var(--accent);cursor:pointer}
  @media (prefers-reduced-motion:reduce){

  /* calculadora: fondos claros, resumen de inversión con protagonismo */
  .calc{margin-top:12px}
  .calc h1{font-size:30px;margin-top:10px}
  .calc .sub{font-size:15px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:24px;align-items:start;margin-top:20px}
  .config{display:flex;flex-direction:column;gap:16px;min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px}
  .sh{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .sh h2{font-size:16px}
  .sh p{color:var(--muted);font-size:13px;margin-left:auto}
  .emp-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .emp-row input{font:inherit;font-size:28px;font-weight:700;width:130px;text-align:center;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--soft);color:var(--ink);outline:none;-moz-appearance:textfield;font-variant-numeric:tabular-nums}
  .emp-row input:focus{border-color:var(--accent);background:#fff}
  .emp-row input::-webkit-outer-spin-button,.emp-row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .emp-row .seg{font-size:13px;color:var(--muted)}.emp-row .seg b{color:var(--ink);font-weight:600}
  .list{display:flex;flex-direction:column;gap:8px}
  .fitem{display:flex;align-items:flex-start;gap:14px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:#fff;transition:border-color .15s,background .15s}
  .fitem:hover{border-color:var(--accent-line)}
  .fitem.on{border-color:var(--accent);background:var(--accent-soft)}
  .chk{width:20px;height:20px;border-radius:6px;border:1.5px solid #D1D5DB;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0;font-weight:700;margin-top:1px;background:#fff}
  .fitem.on .chk{background:var(--accent);border-color:var(--accent)}
  .fbody{flex:1;min-width:0}
  .fn{font-weight:600;font-size:14.5px}
  .fd{font-size:12.5px;color:var(--muted);margin-top:2px}
  .rec{font-size:11px;font-weight:600;padding:2px 8px;border-radius:100px;background:var(--green-soft);color:var(--green-t);margin-left:6px;vertical-align:1px}
  .tagn{font-size:11px;font-weight:600;padding:2px 8px;border-radius:100px;background:var(--purple-soft);color:var(--purple-t);margin-left:6px;vertical-align:1px}
  .fnote{font-size:12px;color:var(--amber-t);margin-top:4px}
  .ver-inc{border:none;background:none;padding:0;margin-top:6px;font-size:12px;font-weight:600;color:var(--accent);cursor:pointer}
  .finc{margin-top:10px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:10px;cursor:default}
  .finc ul{list-style:none;display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px}
  .finc li{font-size:12.5px;color:var(--ink2);padding-left:16px;position:relative;line-height:1.35}
  .finc li::before{content:'✓';position:absolute;left:0;color:var(--green-t);font-weight:700}
  .fp{display:flex;flex-direction:column;align-items:flex-end;text-align:right;min-width:110px;font-variant-numeric:tabular-nums}
  .fpm{font-weight:700;font-size:15px;white-space:nowrap}
  .fpm small{font-size:11.5px;font-weight:500;color:var(--muted)}
  .fps{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap}

  .plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .plan{border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:#fff;transition:border-color .15s}
  .plan:hover{border-color:var(--accent-line)}
  .plan.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .plan.na{opacity:.55;cursor:not-allowed;background:var(--soft)}
  .pname{font-weight:700;font-size:17px}
  .ptag{color:var(--muted);font-size:12.5px;margin:4px 0 8px;line-height:1.35}

  /* prioridad: ¿qué quieres resolver primero? */
  .prio.falta{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft),var(--shadow)}
  .prio-sub{font-size:13px;color:var(--muted);margin:-6px 0 12px}
  .prio-aviso{font-size:12.5px;color:var(--amber-t);background:var(--amber-soft);border-radius:10px;padding:8px 12px;margin-bottom:10px}
  .prio-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .prio-pick button{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px;font-weight:600;font-size:14px;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
  .prio-pick button:hover{border-color:var(--accent);background:var(--accent-soft)}
  .prio-pick .need-ico{width:32px;height:32px;border-radius:9px}
  .prio-pick .need-ico svg{width:18px;height:18px}
  .prio-list{list-style:none;display:flex;flex-direction:column;gap:8px}
  .prio-it{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:8px 10px;transition:border-color .15s,box-shadow .15s}
  .prio-it.first{border-color:var(--accent);background:var(--accent-soft)}
  .prio-it.drag{box-shadow:0 10px 28px rgba(17,24,39,.18);border-color:var(--accent);position:relative;z-index:2}
  .prio-n{width:24px;height:24px;border-radius:50%;background:var(--bg);color:var(--ink2);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-variant-numeric:tabular-nums}

  .prio-nm{flex:1;min-width:0;font-weight:600;font-size:14px}
  .prio-nm small{display:block;font-weight:500;font-size:11.5px;color:var(--accent)}
  .prio-h{width:30px;height:36px;border:none;background:none;color:#9CA3AF;cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:8px}
  .prio-h:active{cursor:grabbing}
  .prio-h svg{width:16px;height:16px}
  .prio-mv{width:36px;height:36px;border:1.5px solid var(--line);background:#fff;border-radius:9px;color:var(--ink2);font-size:15px;font-weight:700;cursor:pointer;flex-shrink:0}
  .prio-mv:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .prio-mv:disabled{opacity:.3;cursor:not-allowed}
  .prio-acts{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
  .prio-ok{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .prio-ok .txt{flex:1;min-width:200px;font-size:14px;color:var(--ink2)}
  .prio-ok .txt b{color:var(--ink)}
  .prio-ok .txt small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
  .btn.sec{background:#fff;color:var(--accent);border:1.5px solid var(--accent);padding:9px 16px;font-size:14px}
  .btn.sec:hover{background:var(--accent-soft)}
  .tb-prio{font-size:13px;color:var(--ink2);background:var(--accent-soft);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tb-prio b{color:var(--ink)}
  .tb-prio.no{background:var(--amber-soft);color:var(--amber-t)}
  .tb-prio button{margin-left:auto;border:none;background:none;padding:0;font-size:12.5px;font-weight:600;color:var(--accent);cursor:pointer;text-decoration:underline}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .totbox{position:sticky;top:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 48px rgba(17,24,39,.14);overflow:hidden}
  .tb-head{background:var(--navy);color:#fff;padding:20px 20px 18px;position:relative;overflow:hidden}
  .tb-head::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(320px 140px at 100% 0%,rgba(37,99,235,.45),transparent 70%)}
  .tb-head > *{position:relative;z-index:1}
  .tb-head .lab{color:var(--on-navy2)}
  .tb-head h2{font-size:15px;font-weight:600;color:var(--on-navy2)}
  .tb-total{font-size:36px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px;color:#fff}
  .tb-total small{font-size:13px;font-weight:500;color:var(--on-navy2);letter-spacing:0}
  .tb-per{font-size:12.5px;color:#D1D5DB;margin-top:4px}
  .tb-per b{color:#fff}
  .tb-save{display:inline-block;font-size:12px;color:#A7F3D0;font-weight:600;margin-top:10px;background:rgba(16,185,129,.14);padding:4px 10px;border-radius:100px}
  .tb-iva{font-size:11px;color:var(--on-navy2);margin-top:8px}
  .tb-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:16px}
  .lab{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
  .bill{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
  .bill button{border:none;background:transparent;padding:8px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
  .bill button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(17,24,39,.12)}

// Motor de pricing de Sora — ÚNICA implementación en JS.
// No se edita a mano en ningún consumidor: build.js lo inyecta en la
// calculadora (index.html) y en el script del skill reunion-comercial.
// Los números viven en pricing-config.json. La fuente de verdad es el Sheet.
(function (root, factory) {
  root.SoraPricingFactory = factory;
  if (typeof module === 'object' && module.exports) module.exports = factory;
})(typeof globalThis !== 'undefined' ? globalThis : this, function (CFG) {
  'use strict';

  // Redondeo "half up" (igual que Math.round para positivos y que el Sheet).
  const R = x => Math.floor(x + 0.5 + 1e-9);
  const PLANES = CFG.planes;
  const rank = p => PLANES.indexOf(p);

  function bracket(e) {
    for (const b of CFG.brackets) if (e >= b.min && e <= b.max) return b;
    return CFG.brackets[CFG.brackets.length - 1];
  }

  function fracStack(e) {
    const m1 = bracket(e).m1;
    return Object.values(CFG.fracStack)
      .reduce((s, f) => s + Math.max(CFG.fracStackMinimo, R(m1 * f)), 0);
  }

  // Precio por empleado del plan en el bracket de e (pesos enteros).
  function nucleo(plan, e, modulos) {
    const b = bracket(e);
    const base = modulos >= 2 ? b.m2 : b.m1;
    return R((base - fracStack(e)) * CFG.factorPlan[plan]);
  }

  // Candado de monotonía: el total nunca baja al agregar empleados.
  // Evalúa el total "como si" e estuviera en el techo de cada bracket
  // anterior y toma el máximo.
  function conCandado(fnTotal, e, brackets) {
    let v = fnTotal(e), candado = false;
    for (const b of (brackets || CFG.brackets)) {
      if (b.min > e) break;
      const x = Math.min(e, b.max);
      const t = fnTotal(x);
      if (t > v) { v = t; candado = true; }
    }
    return { total: v, candado };
  }

  function complementoPorEmp(clave, e) {
    const c = CFG.complementos[clave];
    if (c.incluido) return 0;   // incluido sin costo (Ausencias desde 14-oct-2026)
    return Math.max(c.minimo, R(bracket(e).m1 * c.pctM1));
  }

  // Reloj checador: tabla propia por tramo, con candado. Con módulo: igual en los planes.
  // Solo reloj: PRO usa soloPro y con ≤99 empleados aplica el piso del plan (Diego 28-oct-2026).
  function relojPorEmp(e, conModulo, plan = 'estandar') {
    const bs = CFG.relojChecador.brackets;
    let b = bs[bs.length - 1];
    for (const x of bs) if (e >= x.min && e <= x.max) { b = x; break; }
    if (conModulo) return b.conModulo;
    return plan === 'pro' ? b.soloPro : b.solo;
  }
  function relojMensual(e, conModulo, plan = 'estandar') {
    const r = conCandado(x => x * relojPorEmp(x, conModulo, plan), e, CFG.relojChecador.brackets);
    let total = r.total, piso = false;
    if (!conModulo && e <= CFG.piso.hastaEmpleados && CFG.piso[plan] > total) { total = CFG.piso[plan]; piso = true; }
    return { total, candado: r.candado, porEmp: relojPorEmp(e, conModulo, plan), piso };
  }

  function planMensual(plan, e, modulos) {
    if (!modulos) return { total: 0, candado: false, piso: false };   // solo reloj checador: sin módulo, sin piso
    const r = conCandado(x => x * nucleo(plan, x, modulos), e);
    let total = r.total, piso = false;
    if (e <= CFG.piso.hastaEmpleados) {
      // El piso cubre UN módulo. El 2º módulo se cobra encima a su precio normal (Diego 16-oct-2026).
      const r1 = modulos >= 2 ? conCandado(x => x * nucleo(plan, x, 1), e).total : r.total;
      if (CFG.piso[plan] > r1) { total = CFG.piso[plan] + (r.total - r1); piso = true; }
    }
    return { total, candado: r.candado, piso };
  }

  function complementosMensual(claves, e) {
    if (!claves.length) return { total: 0, candado: false, porEmp: 0 };
    const porEmpEn = x => claves.reduce((s, k) => s + complementoPorEmp(k, x), 0);
    const r = conCandado(x => x * porEmpEn(x), e);
    return { total: r.total, candado: r.candado, porEmp: porEmpEn(e) };

  // Plan mínimo que exige la selección + por qué.
  function planMinimo(sel) {
    const razones = [];
    let min = PLANES[0];
    const sube = (p, razon) => { if (p && rank(p) > rank(min)) min = p; if (p && rank(p) > 0) razones.push(razon); };
    for (const k of sel.complementos) sube(CFG.complementos[k].planMinimo, CFG.complementos[k].nombre + ' requiere Estándar o superior');
    if (sel.demandas) sube(CFG.demandas.planMinimo, 'Demandas se incluye desde Estándar');
    if (sel.recibos && !sel.documentos) sube(CFG.recibosSinDocumentos.planMinimo, 'Recibos sin Documentos requiere Estándar o superior');
    return { plan: min, razones };
  }

  function normaliza(input) {
    const e = parseInt(input.empleados, 10);
    if (!(e >= 1)) throw new Error('empleados debe ser un entero >= 1');
    const plan = (input.plan || 'pro').toLowerCase();
    if ((CFG.planesDescontinuados || {})[plan]) throw new Error(CFG.planesDescontinuados[plan]);
    if (rank(plan) < 0) throw new Error('plan inválido: ' + plan + ' (estandar | pro)');
    const documentos = input.documentos !== undefined ? !!input.documentos : true;
    const recibos = !!input.recibos;
    const reloj = !!input.reloj;
    if (!documentos && !recibos && !reloj) throw new Error('Se necesita Documentos, Recibos o Reloj checador');
    const complementos = [];
    for (const k of (input.complementos || [])) {
      const key = String(k).toLowerCase();
      if (CFG.descontinuados.includes(key)) throw new Error('"' + key + '" está descontinuado desde 27-ago-2026');
      if (key === 'demandas') continue; // se maneja con el flag demandas
      if (!CFG.complementos[key]) throw new Error('complemento desconocido: ' + key);
      if (!complementos.includes(key)) complementos.push(key);
    }
    let demandas = !!input.demandas || (input.complementos || []).map(String).map(s => s.toLowerCase()).includes('demandas');
    const avisos = [];
    if (demandas && !documentos) { demandas = false; avisos.push('Demandas requiere Documentos; se ignoró'); }
    const facturacion = (input.facturacion || 'mensual').toLowerCase().startsWith('anu') ? 'anual' : 'mensual';
    const incluidos = complementos.filter(k => CFG.complementos[k].incluido);
    return { empleados: e, plan, documentos, recibos, reloj, complementos: complementos.filter(k => !CFG.complementos[k].incluido), incluidos, demandas, facturacion, avisos };
  }

  function cotiza(input) {
    const s = normaliza(input);
    const e = s.empleados;
    const modulos = (s.documentos ? 1 : 0) + (s.recibos ? 1 : 0);
    const min = planMinimo(s);
    const planAplicado = rank(s.plan) < rank(min.plan) ? min.plan : s.plan;
    const forzado = planAplicado !== s.plan;

    const p = planMensual(planAplicado, e, modulos);
    const c = complementosMensual(s.complementos, e);
    const rl = s.reloj ? relojMensual(e, modulos > 0, planAplicado) : { total: 0, candado: false, porEmp: 0, piso: false };
    const totalMensual = p.total + c.total + rl.total;
    const anualPorMes = R(totalMensual * (1 - CFG.descuentoAnual));

    const porPlan = {};
    for (const pl of PLANES) {
      const disponible = rank(pl) >= rank(min.plan);
      const pm = planMensual(pl, e, modulos);
      const t = pm.total + c.total + (s.reloj ? relojMensual(e, modulos > 0, pl).total : 0);
      porPlan[pl] = { disponible, totalMensual: t, anualPorMes: R(t * (1 - CFG.descuentoAnual)), planMensual: pm.total };
    }

    return {
      empleados: e,
      segmento: e <= CFG.soraGoHasta ? 'Sora Go' : 'Enterprise',
      documentos: s.documentos, recibos: s.recibos, modulos,
      complementos: s.complementos,
      complementosIncluidos: s.incluidos,
      demandasIncluida: s.demandas,

function renderResultado() {
  const esG = esGo();
  if(!esG) syncPrio();
  const rec = recomendaciones();                                            // módulos respondidos (= necesidades elegidas)
  const princ = porRelevancia(ORDEN.filter(k => rec[k] === 'fuerte'));      // responden a una necesidad directa
  const comp = porRelevancia(ORDEN.filter(k => rec[k] === 'suave'));        // ya resuelven lo básico: complementan
  const otras = ORDEN.filter(k => !rec[k]);                                 // no elegidas -> "otras soluciones"
  const okPrecio = nBase(S.sel) > 0;                                       // el motor necesita Expedientes, Recibos o Reloj
  const btnAdd = (k, cls) => `<button class="${cls} ${S.sel[k] ? 'on' : ''}" onclick="toggle('${k}')" aria-pressed="${!!S.sel[k]}">${S.sel[k] ? '✓ En tu Sora' : '+ Agregar a mi Sora'}</button>`;

  const card = k => {
    const C = CARDS[k], ans = S.resp[k] || 'A';
    const titular = C.titular[ans] || C.titular.def;
    const on = S.sel[k];   // la respuesta (S.resp) sigue decidiendo prioridad y frase; ya no se repite en pantalla
    return `<div class="vc ${on ? 'on' : ''}">
      <div class="vc-main">
        <div class="vc-top">
          <div class="vc-ico">${ICO[MODICO[k]]}</div>
          <div class="vc-head"><div class="vc-name">${C.nombre} <span class="vc-badge">Recomendado</span></div><div class="vc-msg">${titular}</div></div>
          ${esG ? `<button class="vc-add ${on ? 'on' : ''}" onclick="toggle('${k}')">${on ? '✓ Incluido' : '+ Agregar'}</button>` : ''}
        </div>
        <ul class="vc-list">${C.conSora.map(x => `<li>${x}</li>`).join('')}</ul>
        <button class="vc-demo-tg" onclick="verInc('demo_${k}')">${S.abierto['demo_' + k] ? 'Ocultar vista previa ↑' : 'Ver cómo funciona ↓'}</button>
      </div>
      <div class="vc-demo ${S.abierto['demo_' + k] ? '' : 'm-hide'}">${DEMO[k]()}</div>
    </div>`;
  };

  // Complementaria: explica qué suma Sora sin asumir que reemplaza su plataforma. No se preselecciona.
  const compCard = k => {
    const C = CARDS[k], ans = S.resp[k] || 'D', ver = S.abierto['demo_' + k];
    return `<div class="vc comp ${S.sel[k] ? 'on' : ''}">
      <div class="vc-top">
        <div class="vc-ico">${ICO[MODICO[k]]}</div>
        <div class="vc-head"><div class="vc-name">${C.nombre} <span class="vc-badge opt">Complementa</span></div></div>
      </div>
      <div class="vc-pain">${COMPLEMENTA[k]}</div>
      <div class="comp-actions">${btnAdd(k, 'vc-add')}<button class="vc-link" onclick="verInc('demo_${k}')">${ver ? 'Ocultar ↑' : 'Ver cómo funciona ↓'}</button></div>
      ${ver ? `<div class="comp-demo">${DEMO[k]()}</div>` : ''}
    </div>`;
  };

  const cumplCard = S.cumpl ? `<div class="vc cumpl">
      <div class="vc-main">
        <div class="vc-top"><div class="vc-ico">${ICO.shield}</div><div class="vc-head"><div class="vc-name">${CUMPL.nombre} <span class="vc-badge">Para ti</span></div><div class="vc-msg">${CUMPL.titular}</div></div></div>
        <ul class="vc-list">${CUMPL.beneficios.map(x => `<li>${x}</li>`).join('')}</ul>
        <button class="vc-demo-tg" onclick="verInc('demo_cumpl')">${S.abierto.demo_cumpl ? 'Ocultar vista previa ↑' : 'Ver cómo funciona ↓'}</button>
      </div>
      <div class="vc-demo ${S.abierto.demo_cumpl ? '' : 'm-hide'}">${DEMO.cumpl()}</div>
    </div>` : '';

  const mini = k => `<div class="vc-mini">
    <div class="vc-mini-ico">${ICO[MODICO[k]]}</div>
    <div class="vc-mini-b"><div class="vc-mini-n">${CARDS[k].nombre}</div><div class="vc-mini-d">${DESCS[k]}</div></div>
    ${btnAdd(k, 'vc-mini-add')}
  </div>`;

  // Tu Sora ideal = la selección actual (principales + lo que agregue). Es la misma selección que usa la calculadora.
  const ideal = porRelevancia(ORDEN.filter(k => S.sel[k]));
  const cta = esG
    ? `<button class="btn light" onclick="irCalc()" ${okPrecio ? '' : 'disabled'}>Ver precio →</button>`
    : `<button class="btn light" onclick="convertir()">Hablar con Linda →</button>`;
  // Sin importes en el resultado: el precio se descubre en la calculadora. Solo se avisa si falta una solución base.
  const nota = esG && !okPrecio ? 'Agrega Expedientes, Recibos o Reloj checador para ver tu precio.' : '';

  const hay = princ.length || comp.length || S.cumpl;
  const cuerpo = hay
    ? `${princ.length || S.cumpl ? `<div class="vcards">${princ.map(card).join('')}${cumplCard}</div>` : ''}
       ${comp.length ? `<div class="comp-h">También puede ayudarte</div><p class="comp-sub">Ya resuelves lo básico en estos procesos. Esto es lo que Sora puede sumar, si te interesa.</p><div class="vcards">${comp.map(compCard).join('')}</div>` : ''}`
    : `<div class="okbox"><b>Cuéntanos qué quieres mejorar.</b> Regresa y elige al menos una necesidad para ver cómo Sora puede ayudarte.</div>`;
  const bloque = hay ? `<section class="dark ideal" aria-label="Tu Sora ideal">
      <div class="ideal-g">
        <div>
          <h2>Así quedaría tu Sora ideal</h2>
          <div class="ideal-list">${ideal.length || S.cumpl ? '' : '<span class="vacio">Aún no agregas soluciones</span>'}${ideal.map(k => `<span><i></i>${CARDS[k].nombre}</span>`).join('')}${S.cumpl ? `<span><i></i>${CUMPL.nombre}</span>` : ''}</div>

      </div>
    </section>` : '';

  app.innerHTML = `<div class="screen"><div class="prog wide"><button class="back" onclick="atras()">← Regresar</button></div><div class="res">
    <div class="dark res-h">
      <span class="eyebrow">Descubre tu Sora ideal</span>
      <h1>Así puedes simplificar tu operación con Sora.</h1>
      <p class="sub">Conoce cómo Sora puede ayudarte a transformar los procesos que seleccionaste.</p>

    ${!esG ? prioCard() : ''}

}

// Tarjeta "¿Qué quieres resolver primero?". Solo muestra las soluciones elegidas.

  }

function prioResumen() {
  const P = S.prio;
  if (!P.orden.length) return '';
  return P.ok
    ? `<div class="tb-prio">Primero empezaremos con <b>${nomMod(P.orden[0])}</b><button onclick="cambiarPrio()">Cambiar</button></div>`
    : `<div class="tb-prio no">Falta elegir por dónde empezar<button onclick="cambiarPrio()">Elegir</button></div>`;
}

function renderCalc() {
  if (!esGo()) { go(PASOS.indexOf('resultado')); return; }   // Enterprise: sin precios, nunca calculadora
  syncPrio();
  const plan = planAplicado(), min = minimo(), c = cotiza(plan), lin = lineas(plan), rec = recomendaciones();
  const est = cotiza(rank('estandar') < rank(min) ? min : 'estandar'), pro = cotiza('pro');
  const dif = importe(pro) - importe(est);
  // Orden estable por relevancia del diagnóstico (principales, complementarias, resto); no salta al marcar o desmarcar.
  const nv = k => ({ fuerte: 0, suave: 1 }[rec[k]] ?? 2);
  const items = porRelevancia(ORDEN).sort((a, b) => nv(a) - nv(b)).map(k => {
    const on = S.sel[k]; let main, sub;
    if (on) { const l = lin.find(x => x.k === k); if (l.v === 0) { main = 'Incluido'; sub = 'en el mínimo del plan'; } else { main = fmt(l.v) + '<small>/mes</small>'; sub = porEmp(l.v) + ' por empleado'; } }
    else { const d = delta(k); main = (d >= 0 ? '+' : '−') + fmt(Math.abs(d)) + '<small>/mes</small>'; sub = d === 0 ? 'cubierto por el mínimo del plan' : (d >= 0 ? '+' : '−') + porEmp(Math.abs(d)) + ' por empleado'; }
    return `<div class="fitem ${on ? 'on' : ''}" onclick="toggle('${k}')" role="checkbox" aria-checked="${on}" tabindex="0" onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();toggle('${k}')}">
      <span class="chk">${on ? '✓' : ''}</span>
      <div class="fbody"><div class="fn">${CARDS[k].nombre}${rec[k] ? `<span class="rec">${rec[k] === 'fuerte' ? 'Recomendado' : 'Complementa'}</span>` : ''}${k === 'reloj' && relojTag() ? `<span class="tagn">${relojTag()}</span>` : ''}</div>
        <div class="fd">${DESCS[k]}</div>
        <button class="ver-inc" onclick="event.stopPropagation();verInc('${k}')">${S.abierto[k] ? 'Ocultar ↑' : 'Qué incluye ↓'}</button>
        ${S.abierto[k] ? `<div class="finc" onclick="event.stopPropagation()"><ul>${FUNCS[k].map(x => `<li>${x}</li>`).join('')}</ul></div>` : ''}
        ${S.aviso === k ? '<div class="fnote">Necesitas al menos Expedientes, Recibos o Reloj checador</div>' : ''}
      </div>
      <div class="fp ${on ? '' : 'add'}"><span class="fpm">${main}</span><span class="fps">${sub}</span></div>
    </div>`;
  }).join('');
  const planCard = (id, tag) => {
    const disp = rank(id) >= rank(min), pc = id === 'pro' ? pro : est, isSel = id === plan;
    return `<div class="plan ${isSel ? 'sel' : ''} ${disp ? '' : 'na'}" onclick="setPlan('${id}')"><div class="pname">${NOMBRE[id]}</div><div class="ptag">${tag}</div><div class="price">${fmt(importe(pc))}<small> MXN /mes</small></div><div class="peremp">${anual() ? `Pago anual de ${fmt(pc.anualAnio)}` : porEmp(pc.total) + ' por empleado al mes'}</div></div>`;
  };

  app.innerHTML = `<div class="screen"><div class="prog full"><button class="back" onclick="atras()">← Regresar al diagnóstico</button></div><div class="calc">

    <div class="layout"><div class="config">
      <section class="card"><div class="sh"><h2>Colaboradores</h2><p>Pagas por empleado activo</p></div>
        <div class="emp-row"><input type="number" id="empnum" min="1" step="1" inputmode="numeric" value="${S.emp}" oninput="setEmpCalc(this.value)" onfocus="this.select()" aria-label="Colaboradores"><div class="seg">${esGo() ? `<b>Sora Go</b> · hasta ${GO_MAX} colaboradores` : `<b>Sora Enterprise</b> · 100 o más`}</div></div>
      </section>
      <section class="card"><div class="sh"><h2>Tus soluciones</h2><p>Precio mensual según tu combinación</p></div><div class="list">${items}</div></section>
      ${prioCard()}
      <section class="card"><div class="sh"><h2>Elige tu plan</h2></div>
        <div class="plans">${planCard('estandar', 'Todo lo que seleccionaste, listo para operar.')}${planCard('pro', 'Lo mismo, más integraciones API/SSO, administradores ilimitados y más consultas de IA.')}</div>
        <div class="dif">${dif > 0 ? `Por <b>${fmt(dif)}</b> adicionales al mes obtienes PRO.` : ''}</div>
      </section>
    </div>
    <aside class="totbox" aria-label="Tu inversión">

        <div class="tb-per">${anual() ? `Equivale a un pago anual de <b>${fmt(c.anualAnio)}</b> · ${f2(c.anualMes / S.emp)} por empleado al mes` : porEmp(c.total) + ' por empleado al mes'} · Plan ${NOMBRE[plan]}</div>
        <div class="tb-save">${anual() ? `Ahorras ${fmt(ahorro)} al año con pago anual` : `Con pago anual: ${fmt(c.anualMes)} al mes (ahorras ${fmt(ahorro)} al año)`}</div>
        <div class="tb-iva">Precios en MXN sin IVA</div>

      <div class="tb-body">
        <div><div class="lab">Facturación</div><div class="bill"><button class="${anual() ? '' : 'on'}" onclick="setBill('mes')">Mensual</button><button class="${anual() ? 'on' : ''}" onclick="setBill('anu')">Anual <span class="save-tag">−15%</span></button></div></div>
        <div><div class="lab">Desglose · mensual</div>${lin.map(l => `<div class="tl"><span class="ln">${CARDS[l.k].nombre}<small>${l.v ? porEmp(l.v) + ' por empleado' : 'en el mínimo del plan'}</small></span><b class="${l.v ? '' : 'inc0'}">${l.v ? fmt(l.v) : 'Incluido'}</b></div>`).join('')}<div class="tb-flag">${c.piso ? `Incluye el mínimo mensual del plan ${NOMBRE[plan]} (${fmt(CFG.piso[plan])}).` : ''}</div></div>
        <div><div class="lab">Incluido sin costo</div><div class="tb-inc">${incluidos(plan).map(x => `<span>${x}</span>`).join('')}</div></div>
        ${esGo() ? `${cobroBox()}${prioResumen()}<button class="btn big" onclick="convertir()">Contratar y pagar</button><div class="tb-trial"><span class="pay-lock">${LOCK}Pago seguro con tarjeta a través de Stripe</span></div>
          <div class="wa"><span>¿Tienes dudas?</span><a class="btn-wa" href="${waLink()}" target="_blank" rel="noopener" onclick="waDudas()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.9 11.9 0 0 0 4.6 4 5.2 5.2 0 0 0 3.2.7 2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>Hablar con ${agenteActual().nombre}</a></div>`
        : `<button class="btn big" onclick="convertir()">Hablar con Linda</button><div class="tb-trial">Linda recibe tu diagnóstico y te ayuda a agendar una demo de Sora Enterprise.</div>`}
      </div>
      </div>
    </aside></div>
    <div class="foot-note">Precios en MXN sin IVA, por empleado activo al mes. El total nunca baja al sumar empleados. Reloj checador: menor precio si también contratas Expedientes o Recibos. Pricing v${CFG.version}.</div>
  </div></div>`;
  flotantes.innerHTML = `<div class="mbar ${mbarOculta ? 'oculta' : ''}" id="mbar"><div><div class="bt">${fmt(importe(c))}<small> MXN /mes</small></div><div class="bs">${NOMBRE[plan]} · ${S.emp.toLocaleString('es-MX')} colaboradores</div></div><button type="button" onclick="verDesglose()">Ver desglose ↓</button></div>${S.captura ? modalCaptura() : ''}`;
  vigilaDesglose();
}
// ---- Móvil: la barra inferior se muestra solo mientras el desglose está más abajo.
let obsDesglose = null, mbarOculta = false;
function vigilaDesglose() {
  if (obsDesglose) obsDesglose.disconnect();
  const tb = document.querySelector('.totbox'), bar = document.getElementById('mbar');
  if (!tb || !bar || !('IntersectionObserver' in window)) return;
  obsDesglose = new IntersectionObserver(([e]) => {
    mbarOculta = e.isIntersecting || e.boundingClientRect.top <= 0;   // visible o ya lo pasó (footer del sitio)
    bar.classList.toggle('oculta', mbarOculta);
  }, { rootMargin: '0px 0px -60px 0px' });
  obsDesglose.observe(tb);
}
function verDesglose() { track('ver_desglose'); document.querySelector('.totbox')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
// Teclado abierto (cualquier campo con foco): se esconde la barra para que no flote sobre el teclado.
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('input,textarea')) document.body.classList.add('kb-on'); });
document.addEventListener('focusout', () => setTimeout(() => { const a = document.activeElement; if (!a || !a.matches || !a.matches('input,textarea')) document.body.classList.remove('kb-on'); }, 60));
// ---- Modal en móvil: sigue al área visible real (visualViewport) para que el teclado no lo corte ni lo deje desfasado.
function vvSync() { const v = window.visualViewport, r = document.documentElement.style; if (!v) return; r.setProperty('--vvh', v.height + 'px'); r.setProperty('--vvt', v.offsetTop + 'px'); }
function modalOn(on) {
  document.body.classList.toggle('modal-on', on);
  const v = window.visualViewport; if (!v) return;
  if (on) { vvSync(); v.addEventListener('resize', vvSync); v.addEventListener('scroll', vvSync); }
  else { v.removeEventListener('resize', vvSync); v.removeEventListener('scroll', vvSync); document.documentElement.style.removeProperty('--vvh'); document.documentElement.style.removeProperty('--vvt'); }
}
// Al enfocar un campo, centrarlo en lo visible (el teclado ya se abrió) y Enter pasa al siguiente.
function enfoca(el) { setTimeout(() => { try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {} }, 280); }
function sigCampo(ev, sig) { if (ev.key !== 'Enter') return; ev.preventDefault(); if (sig) document.getElementById(sig)?.focus(); else { ev.target.blur(); enviarLead(); } }

// Escapa lo que la persona escribió antes de volver a pintarlo (comillas, <, &).
const escH = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Resumen de lo que está contratando, visible dentro del modal (no se pierde de vista al dejar datos).
function resumenModal() {
  if (!esGo()) return '';
  const plan = planAplicado(), c = cotiza(plan), lin = lineas(plan), P = S.prio, k = cobroHoy();
  return `<div class="modal-sum" aria-label="Tu inversión">
    <div class="ms-n" style="margin:0 0 4px">${anual() ? 'Desglose del pago anual (−15%), sin IVA' : 'Desglose mensual, sin IVA'}</div>
    ${lineasCobro().map(l => `<div class="ms-l"><span>${CARDS[l.k].nombre}</span><b>${l.v ? fmt(l.v) : 'Incluido'}</b></div>`).join('')}
    <div class="ms-l"><span>${incluidos(plan).join(' · ')}</span><b style="color:var(--green-t);font-weight:500">Incluido</b></div>
    <div class="ms-l" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px"><span>Subtotal ${anual() ? 'pago anual (−15%)' : 'mensual'}</span><b>${fmtC(k.sub)}</b></div>
    <div class="ms-l"><span>IVA (16%)</span><b>${fmtC(k.iva)}</b></div>
    <div class="ms-t"><span>Total a cobrar hoy</span><span>${fmtC(k.total)} MXN</span></div>
    <div class="ms-n">Plan ${NOMBRE[plan]} · ${S.emp.toLocaleString('es-MX')} colaboradores${c.piso ? ` · incluye el mínimo del plan (${fmt(CFG.piso[plan])} + IVA)` : ''} · se renueva cada ${anual() ? 'año' : 'mes'}</div>
    ${P.ok && P.orden.length > 1 ? `<div class="ms-p">Primero empezaremos con <b>${nomMod(P.orden[0])}</b> · <button class="vc-link" onclick="cerrarCaptura();cambiarPrio()">Cambiar</button></div>` : ''}
  </div>`;
}
function modalCaptura() {
  const go = esGo();
  return `<div class="ov" onclick="if(event.target===this)cerrarCaptura()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-t">
    <button class="modal-x" onclick="cerrarCaptura()" aria-label="Cerrar">✕</button>
    <h2 id="modal-t">${go ? 'Contratar Sora Go' : 'Habla con Linda'}</h2>
    <p class="modal-sub">${go ? 'Confirma tus datos. Te llevamos a la página segura de Stripe para pagar con tarjeta; ahí también puedes capturar tu RFC.' : 'Déjanos tus datos para continuar por WhatsApp con Linda. Le compartiremos tu diagnóstico y lo que quieres resolver primero.'}</p>
    ${resumenModal()}
    <div class="modal-f">
      <input type="text" id="lead-n" placeholder="Tu nombre" autocomplete="name" enterkeyhint="next" value="${escH(S.lead.nombre)}" oninput="setLead('nombre',this.value)" onfocus="enfoca(this)" onkeydown="sigCampo(event,'lead-e')">
      <input type="email" id="lead-e" placeholder="Correo de trabajo *" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" enterkeyhint="next" value="${escH(S.lead.email)}" oninput="setLead('email',this.value)" onfocus="enfoca(this)" onkeydown="sigCampo(event,'lead-c')" class="${S.leadErr ? 'err' : ''}" ${S.leadErr ? 'aria-invalid="true" aria-describedby="lead-err"' : ''}>
      <input type="text" id="lead-c" placeholder="Empresa" autocomplete="organization" enterkeyhint="go" value="${escH(S.lead.empresa)}" oninput="setLead('empresa',this.value)" onfocus="enfoca(this)" onkeydown="sigCampo(event,null)">
    </div>
    ${S.leadErr ? '<div class="modal-err" id="lead-err">Escribe un correo válido para continuar.</div>' : ''}
    ${S.payErr ? `<div class="modal-err" role="alert">${escH(S.payErr)}</div>` : ''}
    <button class="btn big" ${S.enviando ? 'disabled' : ''} onclick="enviarLead()">${S.enviando ? (go ? 'Abriendo pago seguro…' : 'Enviando…') : (go ? `<span class="pay-lock">${LOCK}Ir a pagar ${fmtC(cobroHoy().total)}</span>` : 'Hablar con Linda')}</button>
    ${go ? '<div class="modal-foot">Te llevaremos a <b>checkout.stripe.com</b> para completar el pago.</div>' : ''}
  </div></div>`;
}

window.__sora = { camposPrioridad, S, recomendaciones, cotiza, resumenTexto, diagnosticoPayload, planAplicado, selInicial, respaldo, ATTR, refBloque, waLink, cobroHoy, pagar, lineasCobro };
if (MODO_PRUEBA) document.getElementById('test-band').hidden = false;
const retomado = restaurarEstado();
render();
track(retomado ? 'retomar_tras_cancelar' : 'vista', ATTR.params());
</script>
</body>
</html>
